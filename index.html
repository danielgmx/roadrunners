<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROADRUNNERS — Schedule 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f4; padding: 16px; max-width: 480px; margin: 0 auto; }
  .header { background: #1a3a6b; color: #fff; padding: 16px; border-radius: 14px; margin-bottom: 16px; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #888; text-transform: uppercase; margin-bottom: 8px; }
  .next-card { background: #fff; border: 2px solid #1a3a6b; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 12px; border-radius: 20px; margin-bottom: 8px; }
  .badge-tonight { background: #d32f2f; color: #fff; }
  .badge-next    { background: #1a3a6b; color: #fff; }
  .matchup { font-size: 18px; font-weight: 600; color: #111; }
  .matchup .vs { color: #888; font-weight: 400; font-size: 15px; }
  .meta { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .meta-item { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #555; }
  .meta-item i { font-size: 16px; color: #1a3a6b; }
  .future-row { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 13px 14px; margin-bottom: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .future-row:active { background: #f0f4fa; }
  .future-row.past { opacity: 0.45; }
  .date-line { display: flex; justify-content: space-between; align-items: center; }
  .date-str { font-size: 13px; font-weight: 600; color: #111; }
  .opp-str { font-size: 13px; color: #555; display: flex; align-items: center; gap: 6px; }
  .chevron { font-size: 17px; color: #aaa; transition: transform 0.2s; display: inline-block; }
  .chevron.open { transform: rotate(180deg); }
  .future-details { display: none; margin-top: 10px; border-top: 1px solid #f0f0f0; padding-top: 10px; flex-direction: column; gap: 6px; }
  .future-details.open { display: flex; }
  .no-games { text-align: center; padding: 24px 0; color: #aaa; font-size: 14px; }
  .footer { text-align: center; font-size: 11px; color: #bbb; margin-top: 20px; padding-bottom: 8px; }
</style>
</head>
<body>

<div class="header">
  <h1><i class="ti ti-ball-basketball" style="font-size:20px;vertical-align:-3px;margin-right:8px;"></i>ROADRUNNERS</h1>
  <p>Border City 35+ Legends League<br>Border City Sportsplex</p>
</div>

<div id="next-section"></div>
<div class="section-label">Full schedule</div>
<div id="games"></div>
<div class="footer">ROADRUNNERS · Fall 2026</div>

<script>
const games = [
  { iso:"2026-09-09", dateLabel:"Wed, Sep 9",  time:"8:15 PM", h:20, m:15, opp:"HOWLAND",            court:"Court 3", gameNum:2  },
  { iso:"2026-09-16", dateLabel:"Wed, Sep 16", time:"9:15 PM", h:21, m:15, opp:"RIP CITY",           court:"Court 1", gameNum:16 },
  { iso:"2026-09-23", dateLabel:"Wed, Sep 23", time:"8:15 PM", h:20, m:15, opp:"FLORES BASKETBALL",  court:"Court 2", gameNum:26 },
  { iso:"2026-09-28", dateLabel:"Mon, Sep 28", time:"8:15 PM", h:20, m:15, opp:"GOPHERS",            court:"Court 2", gameNum:33 },
  { iso:"2026-10-05", dateLabel:"Mon, Oct 5",  time:"9:15 PM", h:21, m:15, opp:"PITBULLS",           court:"Court 1", gameNum:46 },
  { iso:"2026-10-07", dateLabel:"Wed, Oct 7",  time:"9:15 PM", h:21, m:15, opp:"HOODFELLAS",         court:"Court 3", gameNum:54 },
  { iso:"2026-10-14", dateLabel:"Wed, Oct 14", time:"8:15 PM", h:20, m:15, opp:"OLD TYMERS",         court:"Court 1", gameNum:61 },
  { iso:"2026-10-19", dateLabel:"Mon, Oct 19", time:"9:15 PM", h:21, m:15, opp:"THE U",              court:"Court 2", gameNum:71 },
  { iso:"2026-10-26", dateLabel:"Mon, Oct 26", time:"8:15 PM", h:20, m:15, opp:"FREEDOM BROS",       court:"Court 1", gameNum:79 },
  { iso:"2026-10-28", dateLabel:"Wed, Oct 28", time:"8:15 PM", h:20, m:15, opp:"MID RANGE BALLERS",  court:"Court 2", gameNum:84 },
];

const now = new Date();
const todayStr = now.toISOString().slice(0,10);

// Un juego se considera terminado 1 hora después de su hora de inicio
function gameEndTime(g) {
  const d = new Date(g.iso + 'T00:00:00');
  d.setHours(g.h + 1, g.m, 0, 0); // +1 hora
  return d;
}

function gameStartTime(g) {
  const d = new Date(g.iso + 'T00:00:00');
  d.setHours(g.h, g.m, 0, 0);
  return d;
}

// ¿Ya terminó el juego? (pasó 1 hora desde que empezó)
function isPastGame(g) {
  return now >= gameEndTime(g);
}

// ¿Está en curso ahora mismo? (empezó pero no ha pasado 1 hora)
function isLiveGame(g) {
  return now >= gameStartTime(g) && now < gameEndTime(g);
}

// Encuentra el siguiente juego: el primero que no haya terminado
let nextIdx = -1;
for (let i = 0; i < games.length; i++) {
  if (!isPastGame(games[i])) { nextIdx = i; break; }
}

// --- Tarjeta principal ---
const nextSection = document.getElementById('next-section');
if (nextIdx === -1) {
  nextSection.innerHTML = `<div class="no-games" style="margin-bottom:16px;">🏆 Season complete — great run!</div>`;
} else {
  const g = games[nextIdx];
  const isToday = g.iso === todayStr;
  const live = isLiveGame(g);
  const badgeClass = (isToday || live) ? 'badge-tonight' : 'badge-next';
  const badgeText = live ? '🔴 Game in progress' : isToday ? '🔴 Tonight' : 'Next game';
  const sectionTitle = live ? 'In progress' : isToday ? 'Tonight' : 'Next game';

  nextSection.innerHTML = `
    <div class="section-label">${sectionTitle}</div>
    <div class="next-card">
      <span class="badge ${badgeClass}">${badgeText}</span>
      <div class="matchup"><span class="vs">vs</span> ${g.opp}</div>
      <div class="meta">
        <span class="meta-item"><i class="ti ti-calendar"></i>${g.dateLabel}</span>
        <span class="meta-item"><i class="ti ti-clock"></i>${g.time}</span>
        <span class="meta-item"><i class="ti ti-map-pin"></i>Border City Sportsplex — ${g.court}</span>
      </div>
    </div>`;
}

// --- Lista completa ---
const container = document.getElementById('games');
games.forEach((g, i) => {
  const past = isPastGame(g);
  const isNext = i === nextIdx;

  const row = document.createElement('div');
  row.className = 'future-row' + (past ? ' past' : '');
  row.innerHTML = `
    <div class="date-line">
      <span class="date-str">${g.dateLabel}${isNext ? ' <span style="font-size:10px;background:#1a3a6b;color:#fff;padding:2px 7px;border-radius:10px;vertical-align:middle;margin-left:4px;">NEXT</span>' : ''}</span>
      <span class="opp-str">vs ${g.opp} <i class="ti ti-chevron-down chevron" id="chev${i}"></i></span>
    </div>
    <div class="future-details" id="det${i}">
      <span class="meta-item" style="display:flex;align-items:center;gap:6px;font-size:13px;color:#555;"><i class="ti ti-clock" style="font-size:15px;color:#1a3a6b;"></i>${g.time}</span>
      <span class="meta-item" style="display:flex;align-items:center;gap:6px;font-size:13px;color:#555;"><i class="ti ti-map-pin" style="font-size:15px;color:#1a3a6b;"></i>Border City Sportsplex — ${g.court}</span>
      <span class="meta-item" style="display:flex;align-items:center;gap:6px;font-size:13px;color:#555;"><i class="ti ti-hash" style="font-size:15px;color:#1a3a6b;"></i>Game ${g.gameNum}</span>
    </div>`;
  row.addEventListener('click', () => {
    document.getElementById('det'+i).classList.toggle('open');
    document.getElementById('chev'+i).classList.toggle('open');
  });
  container.appendChild(row);
});
</script>
</body>
</html>
